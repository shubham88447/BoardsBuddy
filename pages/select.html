<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Board & Class — BoardsBuddy</title>
  <meta name="description" content="Select your education board and class to personalize your study resources on BoardsBuddy.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="../index.html" class="brand-logo">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        </div>
        <span>BoardsBuddy</span>
      </a>

      <div class="header-actions">
        <!-- Light/Dark Mode Toggle -->
        <button class="theme-toggle-btn" aria-label="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <div id="header-user-actions">
          <a href="auth.html#login" class="btn btn-sm btn-ghost">Login</a>
          <a href="auth.html#signup" class="btn btn-sm btn-primary">Sign Up</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Selection Card Section (Wireframe 2) -->
  <main class="selection-wrapper">
    <div class="selection-card">
      <div class="selection-card-header">
        <div class="icon-circle">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        </div>
        <h2>Choose Your Curriculum</h2>
        <p>Select your education board and class to access customized textbooks, notes, and previous year papers.</p>
      </div>

      <form id="selection-form">
        <!-- 1. Select Board -->
        <div class="form-group">
          <label for="board-select" class="form-label">
            <span>Select Board</span>
            <span class="badge badge-primary">Step 1</span>
          </label>
          <select id="board-select" class="form-select" required>
            <option value="" disabled>-- Select Education Board --</option>
            <option value="11111111-1111-1111-1111-111111111111" selected>Maharashtra State Board (MSBSHSE)</option>
            <option value="22222222-2222-2222-2222-222222222222">CBSE (Central Board of Secondary Education)</option>
          </select>
        </div>

        <!-- 2. Select Class -->
        <div class="form-group">
          <label for="class-select" class="form-label">
            <span>Select Class</span>
            <span class="badge badge-primary">Step 2</span>
          </label>
          <select id="class-select" class="form-select" required>
            <option value="" disabled>-- Select Class --</option>
            <option value="33333333-3333-3333-3333-333333333333" selected>Class 10 (SSC)</option>
            <option value="44444444-4444-4444-4444-444444444444">Class 9</option>
          </select>
        </div>

        <!-- Feedback Alert Container -->
        <div id="selection-feedback" class="hidden" style="margin-bottom: 1.5rem; text-align: left; padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: 0.875rem;"></div>

        <!-- Continue Button -->
        <button type="submit" class="btn btn-lg btn-primary" id="continue-selection-btn" style="width: 100%;">
          <span>Continue to Study Material</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>
  </main>

  <footer class="site-footer" style="margin-top: 0; padding: 2rem 1.5rem;">
    <div class="footer-bottom" style="margin: 0 auto; border-top: none; padding-top: 0;">
      <div>&copy; 2026 BoardsBuddy. Education Board Curriculum Selection.</div>
      <div><a href="../index.html">&larr; Back to Home</a></div>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/data/mock-seed.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/services/auth.js"></script>
  <script src="../js/services/db.js"></script>
  <script src="../js/utils/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const boardSelect = document.getElementById('board-select');
      const classSelect = document.getElementById('class-select');
      const form = document.getElementById('selection-form');
      const feedback = document.getElementById('feedback') || document.getElementById('selection-feedback');
      const continueBtn = document.getElementById('continue-selection-btn');

      // Load existing selection if any
      const savedBoard = localStorage.getItem(BOARDSBUDDY_CONFIG.STORAGE_KEYS.SELECTED_BOARD);
      const savedClass = localStorage.getItem(BOARDSBUDDY_CONFIG.STORAGE_KEYS.SELECTED_CLASS);

      function checkContentAvailability() {
        const isMaharashtra = boardSelect.options[boardSelect.selectedIndex]?.text.includes('Maharashtra');
        const isClass10 = classSelect.options[classSelect.selectedIndex]?.text.includes('10');

        if (isMaharashtra && isClass10) {
          feedback.className = 'hidden';
          feedback.innerHTML = '';
          continueBtn.disabled = false;
        } else {
          feedback.className = '';
          feedback.style.background = 'var(--warning-50)';
          feedback.style.border = '1px solid #fde68a';
          feedback.style.color = '#92400e';
          feedback.innerHTML = `
            <strong>Note:</strong> Content for ${boardSelect.options[boardSelect.selectedIndex]?.text} - ${classSelect.options[classSelect.selectedIndex]?.text} is currently under preparation. Full syllabus is available for <strong>Maharashtra State Board, Class 10</strong>.
          `;
          continueBtn.disabled = false; // still allow exploration with informative prompt
        }
      }

      boardSelect.addEventListener('change', checkContentAvailability);
      classSelect.addEventListener('change', checkContentAvailability);

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const selectedBoardText = boardSelect.options[boardSelect.selectedIndex]?.text;
        const selectedClassText = classSelect.options[classSelect.selectedIndex]?.text;

        localStorage.setItem(BOARDSBUDDY_CONFIG.STORAGE_KEYS.SELECTED_BOARD, selectedBoardText);
        localStorage.setItem(BOARDSBUDDY_CONFIG.STORAGE_KEYS.SELECTED_CLASS, selectedClassText);

        UI.showToast(`Saved preference: ${selectedBoardText} - ${selectedClassText}`, 'success');

        setTimeout(() => {
          window.location.href = 'textbooks.html';
        }, 300);
      });
    });
  </script>
</body>
</html>
