<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Viewer — BoardsBuddy</title>
  <meta name="description" content="Immersive, distraction-free study viewer for textbooks, notes, formula sheets, and solved PYQs on BoardsBuddy.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="overflow: hidden;">

  <!-- Viewer Top Header (Wireframe 10) -->
  <header class="site-header" style="position: static;">
    <div class="header-container" style="max-width: 100%;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <!-- Mobile Sidebar Toggle -->
        <button id="mobile-sidebar-toggle-btn" class="btn btn-sm btn-secondary mobile-sidebar-toggle" aria-label="Toggle Chapters Sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <a href="../index.html" class="brand-logo">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          </div>
          <span>BoardsBuddy</span>
        </a>

        <span class="badge badge-secondary" id="viewer-subject-badge" style="margin-left: 0.5rem;">Subject</span>
      </div>

      <div class="header-actions">
        <!-- Search Button -->
        <button class="header-search-btn" title="Search (Ctrl + K)">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Search</span>
          <kbd class="kbd-shortcut">Ctrl K</kbd>
        </button>

        <!-- Fullscreen Mode Toggle -->
        <button id="fullscreen-toggle-btn" class="theme-toggle-btn" title="Toggle Fullscreen Reading Mode" aria-label="Toggle Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>

        <!-- Exit Viewer Link -->
        <a href="textbooks.html" class="btn btn-sm btn-ghost" id="exit-viewer-btn" title="Back to Study Tabs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Exit</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Viewer Dual-Panel Layout (Wireframe 10) -->
  <div class="viewer-layout" id="viewer-root">
    
    <!-- Left Sidebar: Chapter List -->
    <aside class="viewer-sidebar" id="viewer-sidebar">
      <div class="viewer-sidebar-header">
        <div style="font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 0.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span id="sidebar-subject-title">Chapters</span>
        </div>
        <button id="close-mobile-sidebar-btn" class="btn btn-sm btn-ghost mobile-sidebar-toggle" style="padding: 0.25rem 0.5rem;">
          &times;
        </button>
      </div>

      <div class="viewer-sidebar-chapters" id="sidebar-chapters-list">
        <!-- Rendered by viewer.js -->
      </div>
    </aside>

    <!-- Main Content Reading Area -->
    <main class="viewer-main" id="viewer-main">
      <!-- Breadcrumbs Bar & Actions -->
      <div class="viewer-content-header">
        <nav class="breadcrumbs" id="viewer-breadcrumbs" aria-label="Breadcrumb" style="margin-bottom: 0;">
          <a href="../index.html">Home</a>
          <span class="separator">&gt;</span>
          <a href="select.html">Class 10</a>
          <span class="separator">&gt;</span>
          <span id="crumb-subject">Subject</span>
          <span class="separator" id="crumb-chapter-sep">&gt;</span>
          <span id="crumb-chapter">Chapter</span>
          <span class="separator">&gt;</span>
          <span class="current" id="crumb-type">Notes</span>
        </nav>

        <div style="display: flex; align-items: center; gap: 0.6rem;">
          <!-- Bookmark Button -->
          <button id="bookmark-btn" class="btn btn-sm btn-secondary" title="Save to Bookmarks">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span id="bookmark-label">Bookmark</span>
          </button>

          <!-- Mark Completed Button -->
          <button id="mark-completed-btn" class="btn btn-sm btn-secondary" title="Track study progress">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="completed-label">Mark as Done</span>
          </button>
        </div>
      </div>

      <!-- Main Study Content Body -->
      <div class="viewer-body-container" id="viewer-body-container">
        <!-- Content Title & Metadata -->
        <div class="viewer-title-header" id="viewer-title-header" style="margin-bottom: 1.5rem;">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
            <span class="badge badge-primary" id="resource-type-badge">NOTES</span>
            <span class="badge badge-secondary" id="resource-year-badge">SSC Syllabus</span>
          </div>
          <h1 id="resource-title" style="font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 0.5rem;">Loading content...</h1>
          <p id="resource-description" class="text-secondary" style="font-size: 1rem;"></p>
        </div>

        <!-- Formatted Markdown/Math Content Area -->
        <article id="formatted-content-area" class="solution-box" style="line-height: 1.8; font-size: 1.05rem;">
          <!-- Rendered formatted text and mathematics -->
        </article>

        <!-- Custom PDF Viewer: no native Print/Download toolbar -->
        <div id="pdf-viewer-section" class="custom-pdf-viewer hidden">
          <div class="pdf-toolbar">
            <button id="pdf-prev-page" class="btn btn-secondary" disabled title="Previous page (Left Arrow or click left side)">
              Previous
            </button>

            <span class="pdf-page-info">
              Page <span id="pdf-current-page">1</span>
              of <span id="pdf-total-pages">--</span>
            </span>

            <button id="pdf-next-page" class="btn btn-secondary" disabled title="Next page (Right Arrow or click right side)">
              Next
            </button>

            <span class="pdf-toolbar-divider"></span>

            <button id="pdf-zoom-out" class="btn btn-secondary btn-icon-only" title="Zoom Out" aria-label="Zoom Out">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>

            <span id="pdf-zoom-level">100%</span>

            <button id="pdf-zoom-in" class="btn btn-secondary btn-icon-only" title="Zoom In" aria-label="Zoom In">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>

            <button id="pdf-fit-width" class="btn btn-secondary">
              Fit width
            </button>

            <!-- Full View Mode Button -->
            <button id="pdf-full-view-btn" class="btn btn-secondary" title="Full view mode (F)" aria-label="Toggle Full View Mode">
              <svg class="pdf-full-view-icon-enter" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
              </svg>
              <svg class="pdf-full-view-icon-exit hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
              </svg>
              <span id="pdf-full-view-text">Full view</span>
            </button>
          </div>

          <div id="pdf-error" class="form-error hidden" role="alert"></div>

          <div id="pdf-canvas-container" class="pdf-canvas-container" title="Click right to advance, left to go back">
            <button id="pdf-float-prev" class="pdf-float-nav pdf-float-prev" aria-label="Previous Page" title="Previous Page (&larr; or click left)">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </button>

            <canvas id="pdf-canvas"></canvas>

            <button id="pdf-float-next" class="pdf-float-nav pdf-float-next" aria-label="Next Page" title="Next Page (&rarr; or click right)">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>

            <div id="pdf-page-turn-pill" class="pdf-page-turn-pill hidden"></div>
          </div>
        </div>

        
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/data/mock-seed.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/services/auth.js"></script>
  <script src="../js/services/db.js"></script>
  <script src="../js/services/storage.js"></script>
  <script src="../js/utils/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
  </script>
  <script src="../js/pages/viewer.js"></script>
</body>
</html>
